<body>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Poppins,sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
      overflow:hidden;
      color:#fff;
    }

    .bg::before,
    .bg::after{
      content:"";
      position:absolute;
      width:320px;
      height:320px;
      border-radius:50%;
      filter:blur(90px);
      z-index:-1;
    }

    .bg::before{
      background:#229ED9;
      top:-80px;
      left:-80px;
    }

    .bg::after{
      background:#7c3aed;
      bottom:-80px;
      right:-80px;
    }

    .card{
      width:92%;
      max-width:420px;
      text-align:center;
      padding:40px 28px;
      border-radius:24px;
      background:rgba(255,255,255,.08);
      backdrop-filter:blur(18px);
      border:1px solid rgba(255,255,255,.12);
      box-shadow:0 20px 60px rgba(0,0,0,.45);
    }

    .logo{
      width:90px;
      height:90px;
      margin:auto;
      border-radius:50%;
      background:#229ED9;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:42px;
      box-shadow:0 0 35px rgba(34,158,217,.6);
    }

    h1{
      margin:20px 0 10px;
      font-size:30px;
      font-weight:700;
    }

    p{
      color:#cbd5e1;
      line-height:1.6;
      font-size:15px;
      margin-bottom:28px;
    }

    .btn{
      display:block;
      width:100%;
      padding:16px;
      text-decoration:none;
      border-radius:14px;
      background:linear-gradient(135deg,#229ED9,#0088cc);
      color:#fff;
      font-size:17px;
      font-weight:600;
      transition:.3s;
      box-shadow:0 12px 35px rgba(34,158,217,.45);
    }

    .btn:hover{
      transform:translateY(-3px);
      box-shadow:0 18px 45px rgba(34,158,217,.65);
    }

    .footer{
      margin-top:24px;
      color:#94a3b8;
      font-size:13px;
    }
  </style>

  <div class="bg"></div>

  <div class="card">
      <div class="logo">✈️</div>

      <h1>AZ Mods Adda</h1>

      <p>
        Join our official Telegram channel to get the latest Mod APKs,
        Premium Apps, Updates and Exclusive Releases.
      </p>

      <a class="btn"
         href="https://t.me/az_mods_adda"
         target="_blank">
         🚀 Join Telegram Channel
      </a>

      <div class="footer">
        Official Community • Fast Updates • Trusted Source
      </div>
  </div>

</body>
